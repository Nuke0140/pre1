name: Responsive Viewport Matrix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  responsive-matrix:
    name: Viewport Matrix & Visual Diff Guardrail
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: preone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d preone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated CI database schema
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preone
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/preone

      - name: Seed responsive test fixtures
        run: npx tsx scripts/seed-responsive-ci.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preone
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/preone
      - name: Run Design System & Responsive Unit/Contract Tests
        run: bun test tests/design-system/responsive-transformation.test.ts

      - name: Verify React Hooks and ESLint Guardrails
        run: npx eslint src/app/app/inventory/InventoryClient.tsx

      - name: Build Next.js application
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preone
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/preone

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Responsive Viewport Matrix (7 pages x 9 viewports)
        run: |
          rm -rf .next
          npx playwright test tests/e2e/responsive-matrix.spec.ts
        env:
          CI: 1
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/preone
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/preone

      - name: Upload visual regression snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-matrix-snapshots
          path: tests/visual-regression/snapshots/
          retention-days: 14
